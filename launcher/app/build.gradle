plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivantrj.glasslauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ivantrj.glasslauncher'
        minSdk 25          // The target Fire TV reports Android 7.1 / API 25
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
